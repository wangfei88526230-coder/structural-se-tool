<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f6fb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>儿童结构性SE估算</title>
<style>
:root {
  --bg:#f2f6fb; --card:#fff; --line:#dbe5ef; --text:#152235; --muted:#60758e; --accent:#eaf3ff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text)}
.wrap{max-width:980px;margin:0 auto;padding:24px 18px 48px}
h1{font-size:32px;margin:8px 0 8px}
.sub{color:var(--muted);font-size:16px;line-height:1.6;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;margin:18px 0;box-shadow:0 8px 24px rgba(34,70,110,.05)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
label{display:block;color:var(--muted);font-size:15px;margin-bottom:8px}
input,select{width:100%;font-size:22px;padding:16px 18px;border:1px solid var(--line);border-radius:18px;background:#fff;color:var(--text)}
.refbox{margin-top:18px;background:#f8fbff;border:1px solid var(--line);border-radius:18px;padding:14px 18px}
.row{display:flex;justify-content:space-between;gap:18px;padding:8px 0;font-size:17px}
.row span:first-child{color:var(--muted)}
.value{font-weight:700}
.metric{background:#f7f9fc;border-radius:16px;padding:14px}
.metric .k{color:var(--muted);font-size:14px}
.metric .v{font-size:22px;font-weight:700;margin-top:4px}
.result{background:var(--accent);border:1px solid #c7dcf7;border-radius:20px;padding:20px;margin-top:16px}
.result .big{font-size:44px;font-weight:800;letter-spacing:.5px}
.note{font-size:13px;color:var(--muted);line-height:1.6;margin-top:16px}
@media(max-width:720px){.grid2,.grid3{grid-template-columns:1fr} h1{font-size:28px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>儿童结构性 SE 估算</h1>
  <div class="sub">基于同年龄、同性别标准参考眼进行纯差值校正。输入年龄、性别、眼轴 AL 与角膜 K1、K2；自动计算平均K、结构偏移及结构性SE。所有计算均在本机完成。</div>

  <div class="card">
    <div class="grid2">
      <div>
        <label>年龄（整岁，3–12岁）</label>
        <select id="age"></select>
      </div>
      <div>
        <label>性别</label>
        <select id="sex"><option value="M">男</option><option value="F">女</option></select>
      </div>
    </div>
    <div class="refbox">
      <div class="row"><span>标准 AL</span><span class="value" id="refAL"></span></div>
      <div class="row"><span>标准平均 K</span><span class="value" id="refK"></span></div>
      <div class="row"><span>标准 SE 锚点</span><span class="value" id="refSE"></span></div>
    </div>
  </div>

  <div id="eyes"></div>

  <div class="card note">
    冻结算法 v1.0：<br>
    ΔAL = AL个体 − AL标准；眼轴结构偏移 = −2.5 × ΔAL（D）。<br>
    Kmean = (K1+K2)/2；角膜结构偏移 = −(Kmean个体 − K标准)（D）。<br>
    结构性SE = 标准SE + 眼轴结构偏移 + 角膜结构偏移。<br>
    本工具输出“结构性SE估计值”，不等同于真实散瞳验光SE。
  </div>
</div>
<script>
const REF = {"3": {"M": {"AL": 22.07, "K": 42.83}, "F": {"AL": 21.68, "K": 43.66}, "SE": 2.265}, "4": {"M": {"AL": 22.32, "K": 42.83}, "F": {"AL": 21.9, "K": 43.66}, "SE": 2.265}, "5": {"M": {"AL": 22.55, "K": 42.72}, "F": {"AL": 22.11, "K": 43.38}, "SE": 2.265}, "6": {"M": {"AL": 22.76, "K": 42.78}, "F": {"AL": 22.3, "K": 43.49}, "SE": 2.085}, "7": {"M": {"AL": 22.95, "K": 42.72}, "F": {"AL": 22.47, "K": 43.38}, "SE": 1.74}, "8": {"M": {"AL": 23.12, "K": 42.72}, "F": {"AL": 22.64, "K": 43.27}, "SE": 1.49}, "9": {"M": {"AL": 23.28, "K": 42.72}, "F": {"AL": 22.79, "K": 43.27}, "SE": 1.245}, "10": {"M": {"AL": 23.42, "K": 42.83}, "F": {"AL": 22.92, "K": 43.44}, "SE": 1.04}, "11": {"M": {"AL": 23.53, "K": 42.72}, "F": {"AL": 23.04, "K": 43.32}, "SE": 0.95}, "12": {"M": {"AL": 23.63, "K": 42.67}, "F": {"AL": 23.15, "K": 43.21}, "SE": 0.73}};
const ageSel = document.getElementById('age');
for (let a=3;a<=12;a++) {
  const o=document.createElement('option'); o.value=a; o.textContent=a+'岁'; if(a===7)o.selected=true; ageSel.appendChild(o);
}
const eyeDefs=[['OD','右眼'],['OS','左眼']];
const eyes=document.getElementById('eyes');
for (const [id,cn] of eyeDefs) {
  const d=document.createElement('div'); d.className='card';
  d.innerHTML=`
    <h2>${cn} ${id}</h2>
    <div class="grid3">
      <div><label>AL（mm）</label><input id="${id}_al" inputmode="decimal" placeholder="例如 22.95"></div>
      <div><label>K1（D）</label><input id="${id}_k1" inputmode="decimal" placeholder="例如 42.50"></div>
      <div><label>K2（D）</label><input id="${id}_k2" inputmode="decimal" placeholder="例如 43.00"></div>
    </div>
    <div class="grid3" style="margin-top:16px">
      <div class="metric"><div class="k">Kmean</div><div class="v" id="${id}_km">—</div></div>
      <div class="metric"><div class="k">ΔAL</div><div class="v" id="${id}_dal">—</div></div>
      <div class="metric"><div class="k">ΔK</div><div class="v" id="${id}_dk">—</div></div>
    </div>
    <div class="refbox" style="margin-top:16px">
      <div class="row"><span>眼轴结构偏移</span><span class="value" id="${id}_alse">—</span></div>
      <div class="row"><span>角膜结构偏移</span><span class="value" id="${id}_kse">—</span></div>
    </div>
    <div class="result">
      <div style="color:var(--muted);font-size:17px">结构性 SE 估计值</div>
      <div class="big" id="${id}_se">—</div>
    </div>`;
  eyes.appendChild(d);
}
function fmtSigned(x, n=2, unit='') {
  const s = x>0 ? '+' : '';
  return s + x.toFixed(n) + unit;
}
function getRef() {
  const a=Number(ageSel.value), s=document.getElementById('sex').value;
  return {...REF[a][s], SE:REF[a].SE};
}
function updateRef() {
  const r=getRef();
  refAL.textContent=r.AL.toFixed(2)+' mm';
  refK.textContent=r.K.toFixed(2)+' D';
  refSE.textContent='+'+r.SE.toFixed(3)+' D';
  calcAll();
}
function calcEye(id) {
  const r=getRef();
  const al=parseFloat(document.getElementById(id+'_al').value);
  const k1=parseFloat(document.getElementById(id+'_k1').value);
  const k2=parseFloat(document.getElementById(id+'_k2').value);
  if ([al,k1,k2].some(v=>!Number.isFinite(v))) {
    for (const x of ['km','dal','dk','alse','kse','se']) document.getElementById(id+'_'+x).textContent='—';
    return;
  }
  const km=(k1+k2)/2;
  const dAL=al-r.AL;
  const dK=km-r.K;
  const seAL=-2.5*dAL;
  const seK=-dK;
  const se=r.SE+seAL+seK;
  document.getElementById(id+'_km').textContent=km.toFixed(2)+' D';
  document.getElementById(id+'_dal').textContent=fmtSigned(dAL,2,' mm');
  document.getElementById(id+'_dk').textContent=fmtSigned(dK,2,' D');
  document.getElementById(id+'_alse').textContent=fmtSigned(seAL,2,' D');
  document.getElementById(id+'_kse').textContent=fmtSigned(seK,2,' D');
  document.getElementById(id+'_se').textContent=fmtSigned(se,2,' D');
}
function calcAll(){ calcEye('OD'); calcEye('OS'); }
ageSel.addEventListener('change',updateRef);
document.getElementById('sex').addEventListener('change',updateRef);
for (const [id] of eyeDefs) for (const f of ['al','k1','k2']) document.getElementById(id+'_'+f).addEventListener('input',()=>calcEye(id));
updateRef();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./service-worker.js');
</script>
</body>
</html>
